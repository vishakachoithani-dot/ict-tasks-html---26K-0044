<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task6 table</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #333;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>harry</td>
            <td>17</td>
            <td>A</td>
            <td>h@email.com</td>
        </tr>
        <tr>
            <td>harmoine</td>
            <td>18</td>
            <td>A+</td>
            <td>har@email.com</td>
        </tr>
        <tr>
            <td>john</td>
            <td>20</td>
            <td>B</td>
            <td>j@email.com</td>
        </tr>
        <tr>
            <td>robert</td>
            <td>18</td>
            <td>A</td>
            <td>r@email.com</td>
        </tr>
    </table>
</body>
</html>
